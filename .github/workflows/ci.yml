name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Hook and checker tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the python3 that ships with macOS developer tools; hooks run there.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Hook tests
        run: python -m unittest discover -s hooks/tests -v
      - name: Checker tests
        run: python -m unittest discover -s scripts/tests -v

  agent-docs:
    name: Agent docs check (the kit audits itself)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/agent_docs_check.py . --exclude template --exclude examples --strict

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: "**/*.md"

  plugin:
    name: Plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
